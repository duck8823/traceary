name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Verify bilingual docs
        run: go run ./cmd/repo-tooling docs verify-i18n

      - name: Verify documented Traceary commands
        run: go run ./cmd/repo-tooling docs verify-commands

      - name: Verify Antigravity current-state wording
        run: go run ./cmd/repo-tooling docs verify-antigravity-status

      - name: Verify host-coverage matrix tables
        run: go run ./cmd/repo-tooling docs verify-host-coverage

      - name: Verify removed-alias examples
        run: python3 scripts/verify_docs_no_removed_aliases.py

      - name: Verify changelog coverage
        run: go run ./cmd/repo-tooling release verify-changelog

      - name: Verify landing page in sync with VERSION
        run: go run ./cmd/repo-tooling docs verify-landing

      - name: Verify release-drafter workflow
        run: python3 scripts/verify_release_drafter_workflow.py

  integrations:
    name: Integrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release manifests
        run: python3 scripts/verify_release_manifests.py

      - name: Verify packaged integrations
        run: go run ./cmd/repo-tooling integrations verify

      - name: Verify post-upgrade plugin refresh gate
        run: ./scripts/smoke_test_integrations.sh post-upgrade-plugin-refresh

      - name: Verify post-upgrade live-capture gate
        run: ./scripts/smoke_test_integrations.sh post-upgrade-live-capture

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run tests
        run: go test ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run golangci-lint
        run: go tool golangci-lint run --timeout=5m

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Verify bilingual docs
        run: go run ./cmd/repo-tooling docs verify-i18n

      - name: Verify documented Traceary commands
        run: go run ./cmd/repo-tooling docs verify-commands

      - name: Verify Antigravity current-state wording
        run: go run ./cmd/repo-tooling docs verify-antigravity-status

      - name: Verify host-coverage matrix tables
        run: go run ./cmd/repo-tooling docs verify-host-coverage

      - name: Verify removed-alias examples
        run: python3 scripts/verify_docs_no_removed_aliases.py

      - name: Verify changelog coverage
        run: go run ./cmd/repo-tooling release verify-changelog

      - name: Verify landing page in sync with VERSION
        run: go run ./cmd/repo-tooling docs verify-landing

      - name: Verify release-drafter workflow
        run: python3 scripts/verify_release_drafter_workflow.py

  integrations:
    name: Integrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release manifests
        run: python3 scripts/verify_release_manifests.py

      - name: Verify packaged integrations
        run: go run ./cmd/repo-tooling integrations verify

      - name: Verify post-upgrade plugin refresh gate
        run: ./scripts/smoke_test_integrations.sh post-upgrade-plugin-refresh

      - name: Verify post-upgrade live-capture gate
        run: ./scripts/smoke_test_integrations.sh post-upgrade-live-capture

      - name: Verify record/search/refine matrix
        run: ./scripts/smoke_test_integrations.sh record-search-refine

      - name: Verify staged test selector
        run: ./scripts/smoke_test_integrations.sh staged-selector

      - name: Verify pre-commit Git environment isolation
        run: python3 scripts/test-precommit-env.py

      - name: Verify wave E2E gate
        run: ./scripts/smoke_test_integrations.sh wave-e2e

  test-sqlite:
    name: Test (sqlite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run sqlite tests
        run: go test -count=1 ./infrastructure/sqlite/

  test-cli:
    name: Test (cli)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run presentation tests
        run: go test -count=1 ./presentation/...

  test-rest:
    name: Test (rest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      # Exclusion-based so newly added packages can never fall through
      # the shard gap: every package not covered above runs here.
      - name: Run remaining tests
        run: go list ./... | grep -v -e '^github.com/duck8823/traceary/infrastructure/sqlite$' -e '^github.com/duck8823/traceary/presentation/' | xargs go test -count=1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run golangci-lint
        run: go tool golangci-lint run --timeout=5m
